<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>商品一覧</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
    th { background: #f0f0f0; }
    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
    #errorMsg { color: red; display: none; margin-top: 8px; }
    #loadingMsg { color: #888; display: none; }
  </style>
</head>
<body>
  <h2>商品一覧</h2>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="商品名で検索..." style="width:240px; padding:6px;">
    <button id="searchBtn">検索</button>
    <button id="loadBtn">全件取得</button>
  </div>
  <p id="loadingMsg">読み込み中...</p>
  <p id="errorMsg"></p>
  <table>
    <thead>
      <tr>
        <th>商品ID</th>
        <th>商品名</th>
        <th>カテゴリ</th>
        <th>価格</th>
        <th>在庫数</th>
      </tr>
    </thead>
    <tbody id="productTableBody"></tbody>
  </table>
  <script src="products.js"></script>
</body>
</html>
