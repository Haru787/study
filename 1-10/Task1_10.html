<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task1_10</title>
    <link rel="stylesheet" href="Style1_10.css">
</head>
<body>
    <h1>CSS提出課題</h1>

    <!-- 問1：文字の大きさ -->
    <section class="font-size">
        <h2>第1問：文字の大きさ</h2>
        <p>エンジニア</p>
    </section>

    <!-- 問2：文字の種類 -->
    <section class="font-family">
        <h2>第2問：文字の種類</h2>
        <p>文字のフォントを変更してください</p>
    </section>

    <!-- 問3：背景色 -->
    <section class="background-color">
        <h2>第3問：背景色</h2>
        <p>背景色を変更してください</p>
    </section>

    <!-- 問4：幅・高さ -->
    <section class="size">
        <h2>第4問：幅・高さ</h2>
        <p>横幅・縦幅を指定してください</p>
    </section>

    <!-- 問5：その他プロパティ -->
    <section class="other-properties">
        <h2>第5問：その他プロパティ</h2>
        <div class="box">
            ボックスにmargin, padding, border, box-sizingなどを設定してください
        </div>
    </section>
</body>
</html>
