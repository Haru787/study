<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Task1_9</title>
   <!-- 第3問の回答をここに記載（「link」タグを追加） -->
    <link rel="stylesheet" href="Style1_9.css"
    <!-- head内スタイル（第2問） -->
    <style>
        .head-style h2 {
            /* 第2問の回答をここに記載 */
            color: blue;
            border-bottom: 2px solid blue;
        }
    </style>
</head>
<body>
    <h1>提出課題</h1>

    <!-- 問1：インラインCSS -->
    <section class="inline-style">
        <h2>第1問：インラインCSS</h2>
         <!-- 問1の回答をここに記載 -->
        <p style="color: red;">この段落の文字は赤色です。</p>
        <p> この段落は黒色のままです。</p>
    </section>

    <!-- 問2：head内スタイル(上部に解答箇所あり) -->
    <section class="head-style">
        <h2>第2問：head内スタイル</h2>
        <p>h2タグの文字色と下線はhead内スタイルで指定されています。</p>
    </section>

    <!-- 問3：外部CSS -->
    <section class="external-style">
        <h2>第3問：外部CSS</h2>
        <p>外部CSSファイルで文字色やボーダーが設定されています。</p>
        <div class="box">枠線付きボックス</div>
    </section>

    <!-- 問4：色指定 -->
    <section class="color-practice">
        <h2>第4問：色指定</h2>
        <p class="color-name">カラーネーム</p>
        <p class="hex6">カラーコード6桁</p>
        <p class="hex3">カラーコード3桁</p>
    </section>

    <!-- 問5：枠線 -->
    <section class="border-practice">
        <h2>第5問：枠線（border）</h2>
        <div class="border-box">枠線付きのボックス</div>
    </section>

    <!-- 問6：コメント -->
    <section class="comment-practice">
        <h2>第6問：コメント</h2>
        <p>CSSファイル内にコメントを記述しています。</p>
    </section>
</body>
</html>
