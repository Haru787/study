<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セレクタ練習</title>
    <link rel="stylesheet" href="style1_11.css">
</head>
<body>
    <h1>セレクタの練習</h1>

    <!-- 問1 タグ指定 -->
    <section>
        <h2>問1：タグ名でスタイルをあてる</h2>
        <ul>
            <li>aaa</li>
            <li>bbb</li>
            <li>ccc</li>
        </ul>
        <p>この段落は p タグで囲まれています。</p>
    </section>

    <!-- 問2 class指定 -->
    <section>
        <h2>問2：classで特定の要素だけにスタイルをあてる</h2>
        <ul>
           <li class="select">aaa</li>
            <li>bbb</li>
            <li>ccc</li>
        </ul>
    </section>

    <!-- 問3 同じclassを複数使用 -->
    <section>
        <h2>問3：同じクラスを複数に使ってみよう</h2>
        <ul>
            <li class="select">aaa</li>
            <li class="select">bbb</li>
            <li>ccc</li>
        </ul>
    </section>

    <!-- 問4 タグ指定とclass指定の違い -->
    <section>
        <h2>問4：タグ指定とclass指定の違い</h2>
        <p>この段落は青色にしたい。</p>
        <p class="note">この段落は緑色にしたい。</p>
    </section>

    <!-- 問5 idを使う -->
    <section>
        <h2>問5：idを使って特定の要素だけを装飾</h2>
        <div id="main">メインコンテンツ</div>
    </section>
</body>
</html>
