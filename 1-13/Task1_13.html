  <body>

    <!-- 問1：marginプロパティ -->
    <div class="box box-margin">marginの練習</div>


    <!-- 問2：paddingプロパティ -->
    <div class="box box-padding">paddingの練習</div>


    <!-- 問3：flexの活用1 -->
    <div class="flex-horizontal">
      <div class="flex-box">1</div>
      <div class="flex-box">2</div>
      <div class="flex-box">3</div>
    </div>


    <!--問4：flexの活用2 -->
    <div class="flex-vertical">
      <div class="flex-box">A</div>
      <div class="flex-box">B</div>
      <div class="flex-box">C</div>
    </div>


    <!-- 問5：gapの活用 -->
    <div class="flex-gap">
      <div class="flex-box">X</div>
      <div class="flex-box">Y</div>
      <div class="flex-box">Z</div>
    </div>


    <!-- 問6：総合問題 -->
    <div class="three-column">
      <div class="menu">メニュー</div>
      <div class="main">メインコンテンツ</div>
      <div class="side">サイドバー</div>
    </div>
