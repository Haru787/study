<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>売上ダッシュボード</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    .kpi-cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .kpi-card { background: #f5f5f5; border-radius: 8px; padding: 16px 24px; min-width: 200px; }
    .kpi-card .label { font-size: 0.875rem; color: #666; margin-bottom: 6px; }
    .kpi-card .value { font-size: 1.5rem; font-weight: bold; }
    h3 { margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; max-width: 600px; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; }
    th { background: #f0f0f0; }
    td.num { text-align: right; }
    #loadingMsg { color: #888; }
    #errorMsg { color: red; display: none; }
    button { padding: 8px 20px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h2>月次売上ダッシュボード</h2>
  <button id="loadBtn">データを読み込む</button>
  <p id="loadingMsg" style="display:none;">読み込み中...</p>
  <p id="errorMsg"></p>
  <div id="dashboardPanel" style="display:none;">
    <div class="kpi-cards">
      <div class="kpi-card">
        <div class="label">総売上</div>
        <div class="value" id="totalSales"></div>
      </div>
      <div class="kpi-card">
        <div class="label">注文件数</div>
        <div class="value" id="orderCount"></div>
      </div>
      <div class="kpi-card">
        <div class="label">平均注文金額</div>
        <div class="value" id="avgAmount"></div>
      </div>
      <div class="kpi-card">
        <div class="label">新規会員数</div>
        <div class="value" id="newMembers"></div>
      </div>
    </div>
    <h3>カテゴリ別売上 TOP5</h3>
    <table>
      <thead>
        <tr><th>順位</th><th>カテゴリ</th><th>売上金額</th><th>構成比</th></tr>
      </thead>
      <tbody id="categoryRanking"></tbody>
    </table>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
